<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수행평가 매니저</title>
<meta name="description" content="수행평가 일정 관리와 세특 자료 보관" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app" class="app">
  <header>
    <div class="nav-inner">
      <div class="logo">📚 수행평가 매니저</div>
      <nav>
        <ul>
          <li><a href="#schedule">수행평가 일정</a></li>
          <li><a href="#records">세특 보관함</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div id="notice-banner" class="notice-banner hidden"></div>

  <!-- 수행평가 일정 -->
  <section id="schedule" class="view">
    <h2 class="section-title">수행평가 일정</h2>
    <p class="section-sub">캘린더에서 일정을 확인하고, 오른쪽에서 새 수행평가를 등록하세요.</p>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="schedule-layout">
      <div class="calendar-panel">
        <div class="calendar-header">
          <button type="button" id="cal-prev" class="btn btn-secondary btn-sm">◀</button>
          <span id="calendar-label" class="calendar-label"></span>
          <button type="button" id="cal-next" class="btn btn-secondary btn-sm">▶</button>
        </div>
        <div class="calendar-grid calendar-weekdays">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <div class="form-panel">
        <form id="assignment-form" class="card-form card-form-featured">
          <div class="form-group">
            <label>과목</label>
            <input type="text" id="a-subject" placeholder="예: 통합과학" required />
          </div>
          <div class="form-group">
            <label>수행평가 이름</label>
            <input type="text" id="a-title" placeholder="예: 탐구 보고서 발표" required />
          </div>
          <div class="form-group">
            <label>마감일</label>
            <input type="date" id="a-due" required />
          </div>
          <div class="form-group">
            <label>평가기준 (선생님이 제시한 기준을 붙여넣으세요)</label>
            <textarea id="a-criteria" rows="3" placeholder="예: 창의성, 논리적 전개, 자료 활용, 협업 태도 등"></textarea>
          </div>
          <div class="form-group">
            <label>메모</label>
            <textarea id="a-memo" rows="2" placeholder="추가로 기억할 내용"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">등록하기</button>
            <button type="button" id="assignment-cancel-edit" class="btn btn-secondary hidden">수정 취소</button>
          </div>
        </form>

      </div>
    </div>

    <div class="list-heading-row">
      <h3 class="sub-title" id="list-heading">전체 수행평가</h3>
      <button type="button" id="clear-date-filter" class="btn btn-secondary btn-sm hidden">필터 해제</button>
    </div>
    <div id="assignment-list" class="list"></div>
  </section>

  <!-- 세특 보관함 -->
  <section id="records" class="view">
    <h2 class="section-title">세특 보관함</h2>
    <p class="section-sub">학년·학기를 선택하고 파일을 올려서 보관하세요.</p>

    <form id="record-form" class="card-form card-form-featured">
      <div class="form-row">
        <div class="form-group">
          <label>학년</label>
          <select id="r-grade">
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
          </select>
        </div>
        <div class="form-group">
          <label>학기</label>
          <select id="r-semester">
            <option value="1">1학기</option>
            <option value="2">2학기</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>파일 (2MB 이하 권장)</label>
        <input type="file" id="r-file" />
      </div>
      <div class="form-group">
        <label>메모 (선택)</label>
        <textarea id="r-content" rows="2" placeholder="이 자료에 대한 간단한 설명"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">저장하기</button>
      </div>
      <p id="record-status" class="muted"></p>
    </form>

    <div class="filter-row">
      <div class="form-group">
        <label>학년 필터</label>
        <select id="filter-grade">
          <option value="all">전체 학년</option>
          <option value="1">1학년</option>
          <option value="2">2학년</option>
          <option value="3">3학년</option>
        </select>
      </div>
      <div class="form-group">
        <label>학기 필터</label>
        <select id="filter-semester">
          <option value="all">전체 학기</option>
          <option value="1">1학기</option>
          <option value="2">2학기</option>
        </select>
      </div>
    </div>

    <div id="record-groups"></div>
  </section>

  <footer>
    <p>&copy; 2026 수행평가 매니저 · 데이터는 이 브라우저에만 저장됩니다</p>
  </footer>
</div>

<!-- 준비 방향 가이드 모달 (목록에서 다시 볼 때) -->
<div id="guidance-modal" class="modal hidden">
  <div class="modal-box">
    <button id="guidance-close" class="modal-close">✕</button>
    <h3>준비 방향 제안</h3>
    <div id="guidance-content"></div>
  </div>
</div>

<script src="js/guidance.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
